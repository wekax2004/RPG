<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main-layout">
        <div id="game-column">
            <div id="viewport">
                <canvas id="gameCanvas"></canvas>
            </div>

            <div id="chat-console">
                <div id="chat-log">
                    <!-- Dynamic chat messages will appear here -->
                </div>
                <input id="chat-input" type="text" placeholder="Type to chat..." autocomplete="off">
            </div>
        </div>

        <div id="sidebar">
            <div id="minimap-container">
                <span>Minimap</span>
            </div>

            <div id="status-bars">
                <div class="status-group">
                    <div class="status-header">Health <span id="hp-text">150</span></div>
                    <div class="bar-bg">
                        <div id="hp-bar" class="bar-fg hp"></div>
                    </div>
                </div>
                <div class="status-group">
                    <div class="status-header">Mana <span id="mana-text">50</span></div>
                    <div class="bar-bg">
                        <div id="mana-bar" class="bar-fg mana"></div>
                    </div>
                </div>
                <div class="status-group">
                    <div class="status-header">Capacity <span id="cap-val">0</span></div>
                    <div class="status-header">Gold <span id="gold-val">0</span></div>
                </div>
            </div>

            <div id="skills-container">
                <div class="skill-header">
                    <span>Level</span> <span id="lvl-val">1</span>
                    <span id="xp-pct" class="pct">0%</span>
                </div>
                <div class="bar-bg small">
                    <div id="xp-bar" class="bar-fg xp"></div>
                </div>

                <div class="skill-row">Vocation: <span id="skill-vocation">None</span></div>
                <div class="skill-separator"></div>

                <div class="skill-item">
                    <div class="skill-info"><span>Magic</span> <span id="skill-magic">0</span> <span id="pct-magic"
                            class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-magic" class="bar-fg magic"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-info"><span>Fist</span> <span id="skill-fist">10</span> <span id="pct-fist"
                            class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-fist" class="bar-fg skill"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-info"><span>Club</span> <span id="skill-club">10</span> <span id="pct-club"
                            class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-club" class="bar-fg skill"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-info"><span>Sword</span> <span id="skill-sword">10</span> <span id="pct-sword"
                            class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-sword" class="bar-fg skill"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-info"><span>Axe</span> <span id="skill-axe">10</span> <span id="pct-axe"
                            class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-axe" class="bar-fg skill"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-info"><span>Dist</span> <span id="skill-distance">10</span> <span
                            id="pct-distance" class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-distance" class="bar-fg skill"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-info"><span>Shield</span> <span id="skill-shielding">10</span> <span
                            id="pct-shielding" class="pct">0%</span></div>
                    <div class="bar-bg tiny">
                        <div id="bar-shielding" class="bar-fg skill"></div>
                    </div>
                </div>
            </div>

            <!-- Tibia-Style Equipment Doll (3x4 Grid) -->
            <div id="inventory-container" class="equip-doll">
                <!-- Row 1: Head, Amulet, Backpack -->
                <div class="equip-slot" id="slot-head" data-type="HEAD" title="Head"></div>
                <div class="equip-slot" id="slot-amulet" data-type="AMULET" title="Amulet"></div>
                <div class="equip-slot" id="slot-backpack" data-type="BACKPACK" title="Backpack"></div>

                <!-- Row 2: Left Hand (Shield), Body, Right Hand (Weapon) -->
                <div class="equip-slot" id="slot-lhand" data-type="HAND_L" title="Shield"></div>
                <div class="equip-slot" id="slot-body" data-type="BODY" title="Armor"></div>
                <div class="equip-slot" id="slot-rhand" data-type="HAND_R" title="Weapon"></div>

                <!-- Row 3: Ring, Legs, Ammo -->
                <div class="equip-slot" id="slot-ring" data-type="RING" title="Ring"></div>
                <div class="equip-slot" id="slot-legs" data-type="LEGS" title="Legs"></div>
                <div class="equip-slot" id="slot-ammo" data-type="AMMO" title="Ammo"></div>

                <!-- Row 4: Empty, Boots, Empty -->
                <div class="equip-slot empty"></div>
                <div class="equip-slot" id="slot-boots" data-type="FEET" title="Boots"></div>
                <div class="equip-slot empty"></div>
            </div>

            <!-- Backpack Contents (Inline below equipment in sidebar) -->
            <div id="backpack-panel" class="panel">
                <div class="panel-header">Inventory</div>
                <div id="backpack-grid" class="inventory-grid"></div>
            </div>

            <div id="controls">
                <button id="btn-stop">Stop</button>
                <button id="btn-logout">Logout</button>
            </div>

            <div id="battle-list-header">Battle List</div>
            <div id="battle-list">
                <!-- Entities go here -->
            </div>
        </div>

        <!-- Shop Window (Tibia Style) -->
        <div id="shop-window" class="draggable-window panel"
            style="display: none; width: 300px; position: absolute; top: 100px; left: 100px; z-index: 1000;">
            <div class="window-header panel-header">
                <span id="shop-title">Trade with Donald</span>
                <button id="shop-close-btn" class="close-btn"
                    style="flex: 0; width: 20px; padding: 0; border: none; background: transparent;">x</button>
            </div>

            <div class="window-content" style="display: flex; gap: 5px; padding: 10px; background: #2a2a2a;">
                <div id="shop-items-list"
                    style="flex: 1; height: 200px; background: #1a1a1a; overflow-y: scroll; border: 2px inset #4a4a4a;">
                </div>

                <div style="width: 80px; display: flex; flex-direction: column; gap: 5px;">
                    <button style="height: 30px; opacity: 0.5; cursor: not-allowed;"
                        title="Click items in list to buy">Buy</button>
                    <button style="height: 30px; opacity: 0.5; cursor: not-allowed;">Sell</button>
                    <input type="number" id="trade-amount" value="1" min="1"
                        style="width: 100%; height: 25px; background: #000; color: #fff; border: 1px inset #555;">
                    <div id="total-price" style="font-size: 10px; text-align: center; color: #ffd700;">Total: 0</div>
                </div>
            </div>
        </div>

        <!-- Loot Panel (Dynamic) -->
        <div id="loot-panel" class="panel hidden" style="position: absolute; top: 200px; right: 240px; z-index: 500;">
            <div class="panel-header">
                <span>Corpse</span>
                <div class="close-btn" onclick="document.getElementById('loot-panel').style.display='none'">X</div>
            </div>
            <div id="loot-grid" class="inventory-grid" style="padding: 10px;"></div>
        </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
